<form method="post" action="{% url 'basculer_favori' recette.id %}" class="m-0 {{ classe|default:'' }}">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <button type="submit" class="btn-favori" aria-label="{% if est_favori %}Retirer des favoris{% else %}Ajouter aux favoris{% endif %}" title="{% if est_favori %}Retirer des favoris{% else %}Ajouter aux favoris{% endif %}">
    <i class="ti {% if est_favori %}ti-heart-filled{% else %}ti-heart{% endif %}"></i>
  </button>
</form>
