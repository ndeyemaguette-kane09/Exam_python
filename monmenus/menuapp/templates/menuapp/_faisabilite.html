{% if etat.faisable %}
  <span class="etat-ok">Faisable avec ton stock</span>
{% elif etat.total == 0 %}
  <span class="etat-manque">Aucun ingrédient renseigné</span>
{% else %}
  <span class="etat-manque">Il manque {% for ligne in etat.manquants %}{% if not forloop.first %}{% if forloop.last %} et {% else %}, {% endif %}{% endif %}{{ ligne.ingredient|lower }}{% endfor %}</span>
{% endif %}
