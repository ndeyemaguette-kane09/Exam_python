{% extends 'menuapp/base.html' %}
{% block content %}
  <h2>Supprimer {{ ingredient.nom }}</h2>
  <p>Es-tu sûr(e) de vouloir supprimer cet ingrédient ?</p>
  <form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Oui, supprimer</button>
    <a href="{% url retour %}" class="btn btn-secondary">Annuler</a>
  </form>
{% endblock %}
