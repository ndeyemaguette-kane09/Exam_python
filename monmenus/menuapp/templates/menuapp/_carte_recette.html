{% load equitable %}
<article class="recette">
  {% if recette.image %}
    <img src="{{ recette.image.url }}" alt="" class="photo" loading="lazy">
  {% else %}
    <div class="photo photo-vide"><i class="ti ti-tools-kitchen-2"></i></div>
  {% endif %}
  {% include 'menuapp/_favori.html' %}
  <h3><a href="{% url 'detail_recette' recette.id %}">{{ recette.nom }}</a></h3>
  <div class="infos">
    <span>{{ recette.temps_preparation|duree }}</span>
    <span>{{ recette.cout_estime|fcfa }}</span>
    <span>{{ recette.portions }} pers.</span>
  </div>
  <div class="etat">{% include 'menuapp/_faisabilite.html' %}</div>
</article>
